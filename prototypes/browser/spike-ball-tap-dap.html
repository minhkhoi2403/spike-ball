    if(touching&&!diving&&Number.isFinite(p.hitZ)&&(p.kind!=='s'||sign>0)){
      const dx=(sx(p.hitX)-sx(p.x))/scale+44-anchor;
      const dy=(sy(p.hitY,p.hitZ)-sy(p.y,p.z))/scale+height-shoulder;
      const aim=Math.atan2(-dx,dy);
      const blend=Math.max(0,1-age*1.5);
      swing+=Math.atan2(Math.sin(aim-swing),Math.cos(aim-swing))*blend;
      extension+=Math.max(0,Math.min(.65,Math.hypot(dx,dy)/(hip-shoulder)-1))*blend;
      bend*=1-blend;
    }
    g.save();g.translate(anchor,shoulder);g.rotate(swing);g.scale(1,extension);g.translate(-anchor,-shoulder);
    patch(x,shoulder,w,elbow-shoulder);
    const elbowX=44+sign*21;
    g.translate(elbowX,elbow);g.rotate(bend);g.translate(-elbowX,-elbow);
    patch(x,elbow,w,hip-elbow);g.restore();
  }
  g.restore();
}

const C=document.getElementById('c'),g=C.getContext('2d'),H=document.getElementById('hud');
const S=36,K=12.5,Z=16,OX=240,OY=22,NET=9,G=9.8,NH=2.2;
const sx=x=>Math.round(OX+(x-4.5)*S),sy=(y,z=0)=>Math.round(OY+y*K-z*Z);
const SL={1:[7.5,15.6],6:[4.5,16.3],5:[1.5,15.6],4:[1.5,10.9],3:[4.5,10.5],2:[7.5,10.9]};
const keys=new Set();
const ballRadius=.105, toeReach=.16, attackLine=NET+3;
const lane={x:2.15,y:12.35};
let P,sel,B,T=0,phase,flight,receive,setter,attempt=0,goals=0,feedback='',lastMiss='';
const action=document.querySelector('#action');
const tally=document.querySelector('#tally');
const hints={ready:'Bạn là Thảo, chủ công hàng sau. Vòng xanh đánh dấu vị trí của bạn.',incoming:'Libero chuẩn bị đỡ. Di chuyển về dấu chữ thập phía sau vạch 3 m.',pass:'Bước một tốt. Chạy đà và quan sát chuyền hai.',set:'Bóng đã rời tay chuyền hai. Nhảy và bấm chuột trái khi bóng vừa tầm.',shot:'Đang theo dõi đường đập.'};
function setup(){
  P=TEAMS.flatMap(team=>team.map(p=>{
    const [cx,cy]=SL[p.sl];
    Object.assign(p,{x:p.t?9-cx:cx,y:p.t?18-cy:cy,z:0,vz:0,dv:0,run:0,hold:0,dx:0,dy:0});
    return p;
  }));
  sel=TEAMS[0].find(p=>p.sl===5);
  receive=TEAMS[0].find(p=>p.lib);
  setter=TEAMS[0].find(p=>p.r==='Chuyền hai');
  receive.x=4.4;receive.y=15;setter.x=6;setter.y=10.5;
  sel.x=lane.x;sel.y=15.2;sel.takeoff=null;
  B={x:3,y:4,z:2.9,vx:0,vy:0,vz:0,live:false};
  phase='ready';feedback='';lastMiss='';flight=null;
}
function launch(to,seconds,next){
  phase=next;B.live=true;
  flight={from:{x:B.x,y:B.y,z:B.z},to,seconds,elapsed:0};
  B.vx=(to.x-B.x)/seconds;B.vy=(to.y-B.y)/seconds;B.vz=(to.z-B.z)/seconds+G*seconds/2;
  flight.initialVz=B.vz;
}
function start(){
  setup();attempt++;keys.clear();action.blur();
  launch({x:receive.x,y:receive.y,z:.95},1.45,'incoming');
}
function finish(reason){phase='end';feedback=reason;B.live=false;}
function touch(p,kind){
  p.hold=.3;p.kind=kind;p.hitX=B.x;p.hitY=B.y;p.hitZ=B.z;
}
function jump(){
  if(phase==='ready'||phase==='end'||sel.z>0||sel.vz>0)return;
  sel.takeoff=sel.y-toeReach;sel.vz=5.25;
}
function swing(){
  if(phase==='ready'||phase==='end'||phase==='shot'||sel.hold>0)return;
  touch(sel,'s');
  const reach=B.z-sel.z;
  if(phase!=='set')lastMiss='Vung sớm, bóng chưa đến lượt chủ công.';
  else if(sel.z<.12)lastMiss='Vung khi còn đứng đất. Nhấn Space trước cú đánh.';
  else if(Math.hypot(sel.x-B.x,sel.y-B.y)>.82)lastMiss='Bóng ngoài tầm ngang. Chỉnh vị trí chạy đà.';
  else if(reach>2.25)lastMiss='Bóng cao hơn tầm tay. Chờ bóng hạ hoặc chỉnh nhịp nhảy.';
  else if(reach<1.15)lastMiss='Bóng đã thấp hơn tay đập. Vung sớm hơn.';
  else {
    const illegal=sel.takeoff<=attackLine && B.z-ballRadius>NH;
    launch({x:6.4,y:4.1,z:ballRadius},.79,'shot');flight.illegal=illegal;return;
  }
  feedback=lastMiss;
}
function advance(dt){
  T+=dt;
  P.forEach(p=>{p.hold=Math.max(0,p.hold-dt);p.run=0;});
  if(sel.z>0||sel.vz>0){sel.z=Math.max(0,sel.z+sel.vz*dt-.5*G*dt*dt);sel.vz=sel.z>0?sel.vz-G*dt:0;}
  if(phase==='ready'||phase==='end')return;
  const dx=Number(keys.has('KeyD'))-Number(keys.has('KeyA')),dy=Number(keys.has('KeyS'))-Number(keys.has('KeyW'));
  const length=Math.hypot(dx,dy);
  if(length){sel.dx=dx/length;sel.dy=dy/length;sel.run=1;
    sel.x=Math.max(-1.4,Math.min(10.4,sel.x+sel.dx*4.6*dt));
    sel.y=Math.max(NET+.3,Math.min(19,sel.y+sel.dy*4.6*dt));
  }
  const f=flight,prevY=B.y;
  f.elapsed+=dt;
  const time=phase==='set'?f.elapsed:Math.min(f.elapsed,f.seconds);
  B.x=f.from.x+B.vx*time;B.y=f.from.y+B.vy*time;
  B.z=f.from.z+f.initialVz*time-.5*G*time*time;B.vz=f.initialVz-G*time;
  if(phase==='shot'&&prevY>NET&&B.y<=NET){
    const crossing=(NET-f.from.y)/B.vy;
    const height=f.from.z+f.initialVz*crossing-.5*G*crossing*crossing;
    if(height-ballRadius<NH){finish('Bóng mắc lưới. Thử chạm bóng cao hơn.');return;}
  }
  if(phase==='shot'&&f.illegal&&B.y+ballRadius<=NET){finish('Lỗi hàng sau. Lúc giậm, mũi chân chạm hoặc vượt vạch 3 m.');return;}
  if(phase==='set'){
    if(B.z<=ballRadius){B.z=ballRadius;finish(lastMiss||'Bóng rơi. Nhấn chuột trái để vung tay khi bóng vừa tầm.');}
    return;
  }
  if(f.elapsed+1e-8<f.seconds)return;
  if(phase==='incoming'){touch(receive,'d');launch({x:setter.x,y:setter.y,z:1.8},1.35,'pass');}
  else if(phase==='pass'){touch(setter,'v');launch({x:lane.x,y:lane.y,z:2.87},1.15,'set');feedback='';}
  else if(phase==='shot'){goals++;finish('Đập thành công. Bóng qua lưới và rơi trong sân.');}
}
function land(b){
  const time=(b.vz+Math.sqrt(Math.max(0,b.vz*b.vz+2*G*(b.z-ballRadius))))/G;
  return {x:b.x+b.vx*time,y:b.y+b.vy*time};
}

const r=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
function ball(){const x=sx(B.x),y=sy(B.y,B.z);r('#f0e9c8',x-2,y-3,4,6);r('#f0e9c8',x-3,y-2,6,4);r('#2b4fa0',x-1,y-3,2,6);r('#f3c62b',x-3,y-1,6,1)}
function net(){
 const x=sx(-.3),end=sx(9.3),top=sy(NET,NH),bottom=sy(NET,NH-1);
 for(let col=x;col<end;col+=5)r('rgba(30,42,66,.55)',col,top,1,bottom-top);
 for(let row=top;row<=bottom;row+=4)r('rgba(30,42,66,.55)',x,row,end-x,1);
 r('#fff5df',x,top,end-x,2);r('#23364c',x-2,top-2,2,sy(NET)-top+2);r('#23364c',end,top-2,2,sy(NET)-top+2);
}
function draw(){r('#2fd0b5',0,0,480,270);const x0=sx(0),x1=sx(9),y0=sy(0),y1=sy(18);r('#e8a07c',x0,y0,x1-x0,y1-y0);
 [[x0-1,y0-1,x1-x0+2,2],[x0-1,y1-1,x1-x0+2,2],[x0-1,y0,2,y1-y0],[x1-1,y0,2,y1-y0],[x0,sy(6),x1-x0,1],[x0,sy(12),x1-x0,1],[x0,sy(NET),x1-x0,1]].forEach(a=>r('#fff3e6',...a));
 const markX=sx(lane.x),markY=sy(lane.y);
 r('#794c40',markX-4,markY,9,1);r('#794c40',markX,markY-2,1,5);
 P.forEach(p=>r('rgba(60,30,20,.35)',sx(p.x)-4,sy(p.y)-1,8,2));r('rgba(60,30,20,.4)',sx(B.x)-3,sy(B.y)-1,6,2);
 g.lineWidth=1;g.strokeStyle='#7cfc00';g.beginPath();g.ellipse(sx(sel.x),sy(sel.y),7,3,0,0,7);g.stroke();
 if(B.live){const L=land(B);g.strokeStyle='#ffe14d';g.setLineDash([2,2]);g.beginPath();g.ellipse(sx(L.x),sy(L.y),6,3,0,0,7);g.stroke();g.setLineDash([])}
 [...P.map(p=>[p.y,()=>playerArt(p)]),[B.y+B.z*.3+.5,ball],[NET,net]].sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]())}
function fit(){C.style.width=480*Math.max(1,Math.floor(Math.min(innerWidth/480,(innerHeight-90)/270)))+'px'}
addEventListener('resize',fit);fit();
action.addEventListener('click',start);
addEventListener('keydown',e=>{
  if(['KeyW','KeyA','KeyS','KeyD','Space','KeyR'].includes(e.code)){
    e.preventDefault();keys.add(e.code);
    if(!e.repeat){if(e.code==='Space')jump();if(e.code==='KeyR')start();}
  }
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
C.addEventListener('pointerdown',e=>{if(e.button===0){e.preventDefault();swing();}});
setup();let last=null,acc=0;
function loop(ts){
 acc+=last===null?0:Math.min(.06,(ts-last)/1000);last=ts;
 while(acc>=1/60){advance(1/60);acc-=1/60;}
 draw();
 H.textContent=feedback||hints[phase]||'';
 tally.textContent='Thành công '+goals+' / '+attempt;
 action.textContent=phase==='ready'?'Bắt đầu':'Thử lại';
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
